services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-saver-bot:local
    container_name: media_saver_bot_local
    restart: unless-stopped
    stop_grace_period: 25s
    env_file:
      - .env
    # Локальные прокси (V2Ray / TgWsProxy) запущены на хосте Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # Создайте пустой cookies.txt до старта (type nul > cookies.txt),
      # иначе Docker создаст на этом месте каталог.
      - ./cookies.txt:/app/cookies.txt:ro
      - bot_temp:/tmp/media_saver_bot
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: local_telegram_bot_api
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api
      - bot_temp:/tmp/media_saver_bot:ro
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  bot_temp:
  telegram_api_data:
