services:
  bot:
    build: .
    container_name: media_saver_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt:ro
      - bot_temp:/tmp/media_saver_bot

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: local_telegram_bot_api
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-""}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api
      - bot_temp:/tmp/media_saver_bot:ro
    ports:
      - "8081:8081"

volumes:
  bot_temp:
  telegram_api_data:
