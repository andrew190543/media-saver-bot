services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: media-saver-xray
    restart: unless-stopped
    volumes:
      - /DATA/AppData/xray:/usr/local/etc/xray:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bot:
    image: ghcr.io/andrew190543/media-saver-bot:latest
    container_name: media_saver_bot
    restart: unless-stopped
    stop_grace_period: 25s
    network_mode: "service:xray"
    depends_on:
      - xray
    env_file:
      - .env
    volumes:
      # Папка данных на хосте должна принадлежать UID/GID 10001:
      # sudo mkdir -p /DATA/AppData/media-saver-bot/data && sudo chown -R 10001:10001 /DATA/AppData/media-saver-bot/data
      - /DATA/AppData/media-saver-bot/data:/app/data
      # Создайте пустой cookies.txt до старта, иначе Docker создаст каталог:
      # touch /DATA/AppData/media-saver-bot/cookies.txt && chmod 644 /DATA/AppData/media-saver-bot/cookies.txt
      - /DATA/AppData/media-saver-bot/cookies.txt:/app/cookies.txt:ro
      - bot_temp:/tmp/media_saver_bot
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: local_telegram_bot_api
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
      # При необходимости исходящего HTTP-прокси (например, для webhook/HTTP-запросов)
      # используйте TELEGRAM_PROXY=http://host:port (MTProto-трафик в РФ не проксируется этой переменной).
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api
      - bot_temp:/tmp/media_saver_bot:ro
    ports:
      - "127.0.0.1:8081:8081"

  # На сервере с уже запущенным Watchtower не включайте этот профиль,
  # чтобы избежать конфликта имени контейнера /watchtower.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    profiles: ["watchtower"]
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_TIMEOUT: "30s"
      # Если GHCR-пакет приватный, раскомментируйте и добавьте в .env:
      # GHCR_USER=your_github_login
      # GHCR_TOKEN=ghp_...  # PAT с правом read:packages
      # REPO_USER: ${GHCR_USER}
      # REPO_PASS: ${GHCR_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  bot_temp:
  telegram_api_data:
